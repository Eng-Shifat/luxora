<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#FBF8F5" />
    <style>html,body{background:#FBF8F5}</style>
    <title>Luxora – Own Your Signature Style</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
    <script>document.documentElement.classList.add("splashing")</script>
    <style>
      html.splashing{overflow:hidden}
      html.splashing #root *{animation-play-state:paused!important}
      #splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(90% 70% at 50% 40%,#FFFDFB 0%,#FBF8F5 55%,#F3EBE4 100%);transition:opacity .7s ease,visibility .7s,transform .7s cubic-bezier(.7,0,.3,1)}
      #splash.hide{opacity:0;visibility:hidden;transform:scale(1.04)}
      #splash .sp-in{display:flex;flex-direction:column;align-items:center;gap:22px}
      #splash .sp-logo{position:relative;width:104px;height:104px;background:url(/logo.png) center/contain no-repeat;opacity:0;animation:spLogo 1s cubic-bezier(.2,.9,.25,1.1) .1s forwards,spFloat 3s ease-in-out 1.1s infinite}
      #splash .sp-logo::before{content:"";position:absolute;inset:-26px;border-radius:50%;background:radial-gradient(circle,rgba(185,138,75,.28),transparent 68%);animation:spGlow 2.4s ease-in-out infinite}
      #splash .sp-logo::after{content:"";position:absolute;inset:0;-webkit-mask:url(/logo.png) center/contain no-repeat;mask:url(/logo.png) center/contain no-repeat;background:linear-gradient(105deg,transparent 43%,rgba(255,255,255,.95) 50%,transparent 57%);background-size:250% 100%;background-position:100% 0;animation:spShine 1.5s ease-in-out .9s infinite}
      #splash .sp-word{display:flex;gap:.28em;font:600 26px/1 Outfit,system-ui,sans-serif;letter-spacing:.2em;color:#1E1A16;padding-left:.2em}
      #splash .sp-word span{opacity:0;transform:translateY(14px);animation:spLetter .55s cubic-bezier(.2,.8,.2,1) forwards}
      #splash .sp-word span:nth-child(1){animation-delay:.55s}#splash .sp-word span:nth-child(2){animation-delay:.62s}#splash .sp-word span:nth-child(3){animation-delay:.69s}#splash .sp-word span:nth-child(4){animation-delay:.76s}#splash .sp-word span:nth-child(5){animation-delay:.83s}#splash .sp-word span:nth-child(6){animation-delay:.9s}
      #splash .sp-bar{width:132px;height:3px;border-radius:3px;background:rgba(196,81,45,.16);overflow:hidden;opacity:0;animation:spFade .4s 1s forwards}
      #splash .sp-bar i{display:block;height:100%;width:100%;border-radius:3px;background:linear-gradient(90deg,#C4512D,#B98A4B);transform-origin:left;transform:scaleX(0);animation:spBar 1.7s cubic-bezier(.4,0,.2,1) 1s forwards}
      @keyframes spLogo{from{opacity:0;transform:scale(.45) rotate(-18deg)}to{opacity:1;transform:none}}
      @keyframes spFloat{0%,100%{translate:0 0}50%{translate:0 -6px}}
      @keyframes spGlow{0%,100%{opacity:.5;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}
      @keyframes spShine{0%,35%{background-position:100% 0}100%{background-position:0 0}}
      @keyframes spLetter{to{opacity:1;transform:none}}
      @keyframes spFade{to{opacity:1}}
      @keyframes spBar{to{transform:scaleX(1)}}
      @media(prefers-reduced-motion:reduce){#splash *,#splash *::before,#splash *::after{animation:none!important;opacity:1!important;transform:none!important}#splash .sp-bar i{transform:none}}
    </style>
    <noscript><style>#splash{display:none}html.splashing{overflow:auto}</style></noscript>
  </head>
  <body>
        <div id="splash" aria-hidden="true">
      <div class="sp-in">
        <div class="sp-logo"></div>
        <div class="sp-word"><span>L</span><span>U</span><span>X</span><span>O</span><span>R</span><span>A</span></div>
        <div class="sp-bar"><i></i></div>
      </div>
    </div>
    <script>
      (function () {
        var start = Date.now(), s = document.getElementById("splash"), gone = false;
        var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
        var MIN = reduce ? 500 : 2800; // splash minimum koto ms thakbe
        function hide() {
          if (gone) return; gone = true;
          s.classList.add("hide");
          document.documentElement.classList.remove("splashing");
          setTimeout(function () { s.remove(); }, 900);
        }
        function ready() { setTimeout(hide, Math.max(0, MIN - (Date.now() - start))); }
        if (document.readyState === "complete") ready(); else addEventListener("load", ready);
        setTimeout(hide, 7000); // safety: kono karone atke gele 7s e hide
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
